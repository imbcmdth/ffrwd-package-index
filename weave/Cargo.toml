[package]
name = "weave"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "The ffrwd/index weave node: embedding vectors woven into an encoded video stream."

[lib]
name = "weave"
crate-type = ["cdylib"]

# ffrwd-node, the two crates of this workspace, and `ffrwd-nal` for the
# framing of a coded packet, which is shared with the other ffrwd packages
# rather than copied here and has no dependencies of its own. The rows are
# `ffrwd-index-rows`, which the tool reads and writes the same rows with;
# serde_json is here for the node's params and to hand those rows on as
# they were written.
[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
ffrwd-index-core = { path = "../core" }
ffrwd-index-rows = { path = "../rows" }
ffrwd-nal = { workspace = true }
serde_json = { version = "1.0.151", features = ["raw_value"] }
