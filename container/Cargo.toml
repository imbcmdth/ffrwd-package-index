[package]
name = "ffrwd-index-container"
version = "0.1.0"
edition = "2021"
description = "Reading the samples and the file index of MP4 and Matroska, natively, for ffrwd-index-core"
license = "Apache-2.0"

# The boxes of an ISO base media file are `ffrwd-bmff`'s and the NAL
# units and OBUs inside a sample are `ffrwd-nal`'s; both are
# dependency-free, forbid unsafe code and are fuzzed and truncated
# against real files in their own repositories. What is left here is
# Matroska, which nothing else on this machine reads, and the prefix
# scan, which is the one place the two layers meet.
[dependencies]
ffrwd-bmff = { workspace = true }
ffrwd-index-core = { path = "../core" }
ffrwd-nal = { workspace = true }
