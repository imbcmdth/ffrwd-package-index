[package]
name = "ffrwd-index"
version = "0.1.0"
edition = "2021"
description = "Weave embedding vectors into a video elementary stream, and read them back"
license = "Apache-2.0"

[[bin]]
name = "ffrwd-index"
path = "src/main.rs"

# Nothing fetched: `core` is the codec, `rows` is the JSON and
# `container` is MP4 and Matroska, and all three are in this workspace.
[dependencies]
ffrwd-index-container = { path = "../container" }
ffrwd-index-core = { path = "../core" }
ffrwd-index-rows = { path = "../rows" }
