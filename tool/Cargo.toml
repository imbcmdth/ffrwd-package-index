[package]
name = "ffrwd-index"
version = "0.1.0"
edition = "2021"
description = "Weave embedding vectors into a video elementary stream, and read them back"
license = "Apache-2.0"

[[bin]]
name = "ffrwd-index"
path = "src/main.rs"

# `core` is the codec, `rows` is the JSON and `container` is Matroska
# and the prefix scan, all three in this workspace. The two fetched
# crates are the byte level the format rides on: `ffrwd-bmff` finds the
# samples of an MP4 and puts the index box into one, `ffrwd-nal` cuts a
# stream into access units. Neither has dependencies of its own.
[dependencies]
ffrwd-bmff = { workspace = true }
ffrwd-index-container = { path = "../container" }
ffrwd-index-core = { path = "../core" }
ffrwd-index-rows = { path = "../rows" }
ffrwd-nal = { workspace = true }
