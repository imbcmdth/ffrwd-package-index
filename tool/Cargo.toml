[package]
name = "ffrwd-index"
version = "0.1.0"
edition = "2021"
description = "Weave embedding vectors into a video elementary stream, and read them back"
license = "Apache-2.0"

[[bin]]
name = "ffrwd-index"
path = "src/main.rs"

# The argument reading and the JSON are a page each and are written out
# in the crate, so the tool builds with nothing fetched.
[dependencies]
ffrwd-index-core = { path = "../core" }
