[package]
name = "ffrwd-index"
version = "0.1.0"
edition = "2021"
description = "Weave embedding vectors into a video elementary stream, and read them back"
license = "Apache-2.0"

[[bin]]
name = "ffrwd-index"
path = "src/main.rs"

# Nothing fetched: `core` is the codec and `rows` is the JSON, and both
# are in this workspace.
[dependencies]
ffrwd-index-core = { path = "../core" }
ffrwd-index-rows = { path = "../rows" }
